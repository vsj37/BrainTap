<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrainTap</title>
  </head>
  <body>
    <main>
      <header>
        <h1>BrainTap</h1>
        <div id="hud">Round <span id="round">1</span>/<span id="rounds">3</span> · Score <span id="total">0</span>/<span id="maxTotal">100</span></div>
      </header>

      <p id="prompt"></p>
      <p id="sub"></p>
      <canvas id="c"></canvas>

      <div class="ctl">
        <label for="ap">AP (Bregma) <output id="apOut"></output> mm</label>
        <input id="ap" type="range" />
      </div>

      <div id="result" hidden></div>
      <div class="btns">
        <button id="view" hidden></button>
        <button id="next" hidden>Next</button>
        <button id="copy" hidden>Copy result</button>
      </div>
    <footer>Image credit: <a href="https://atlas.brain-map.org">Allen Institute</a> (Allen Mouse Common Coordinate Framework)</footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
